<!DOCTYPE html>
<html lang="en">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <head>
    <meta charset="UTF-8">
    <title>Base64 - KF0ZFX.com</title>
  </head>
  <body>
    <form>
      <select name="ED3" id="ED3">
  	    <option value="E">Encode</option>
	  	  <option value="D">Decode</option>
      </select>
      <br>
      <input type="text" id="input" name="input">
      <button type="button" onclick="ED()">Calculate</button>
      <br>
      <output id="output" name="result" for="ED3 input">Output will appear here.</output>
    </form>
    <script>
      function ED() {
        let ED2 = document.getElementById("ED3").value
        if (ED2 == "E") {
          document.getElementById("output").textContent = btoa(document.getElementById("input").value);
        } else {
          document.getElementById("output").textContent = atob(document.getElementById("input").value);
        }
      }
    </script>
  </body>
</html>
